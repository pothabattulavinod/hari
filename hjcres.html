<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Results Portal</title>

<style>
:root{
  --primary:#60a5fa;
  --bg:#0b1220;
  --card:rgba(255,255,255,0.06);
  --border:rgba(255,255,255,0.12);
  --text:#f8fafc;
}

*{box-sizing:border-box;}

body{
  margin:0;
  font-family:Segoe UI, sans-serif;
  background:radial-gradient(circle at top,#1e3a8a,#0b1220 50%);
  color:var(--text);
  overflow-x:hidden;
}

/* HEADER */
header{
  text-align:center;
  padding:16px 10px;
  background:rgba(255,255,255,0.05);
  border-bottom:1px solid var(--border);
  backdrop-filter:blur(10px);
}

header h2{
  margin:0;
  font-size:18px;
  font-weight:800;
}

header small{
  display:block;
  margin-top:4px;
  font-size:11px;
  opacity:0.8;
}

/* WRAPPER */
.wrapper{
  max-width:900px;
  margin:auto;
  padding:14px;
  display:flex;
  flex-direction:column;
  gap:14px;
}

/* STATS */
.stats{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
}

.statBox{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:12px;
  padding:12px;
  text-align:center;
  backdrop-filter:blur(10px);
}

/* SEARCH */
.searchBox{
  padding:5px 0;
}

.searchBox input{
  width:100%;
  padding:12px;
  border-radius:10px;
  border:1px solid var(--border);
  background:rgba(255,255,255,0.05);
  color:white;
  outline:none;
  font-size:14px;
}

/* LIST */
.list{
  display:flex;
  flex-direction:column;
  gap:12px;
}

/* CARD */
.row{
  display:flex;
  flex-direction:column;
  gap:10px;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:14px;
  padding:14px;
  backdrop-filter:blur(12px);
}

/* TOP */
.topline{
  display:flex;
  justify-content:space-between;
  gap:8px;
  flex-wrap:wrap;
}

.name{
  font-size:15px;
  font-weight:800;
  color:var(--primary);
}

.score{
  font-weight:700;
}

/* META */
.meta{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
}

.roll, .address{
  font-size:11px;
  padding:4px 8px;
  border-radius:6px;
}

.roll{
  background:rgba(59,130,246,0.18);
  border:1px solid rgba(59,130,246,0.35);
  font-family:monospace;
}

.address{
  background:rgba(34,197,94,0.12);
  border-left:3px solid #22c55e;
}

/* BAR */
.bar{
  width:100%;
  height:6px;
  background:rgba(255,255,255,0.15);
  border-radius:10px;
  overflow:hidden;
}

.fill{
  height:100%;
  width:0%;
  background:linear-gradient(90deg,#22c55e,#16a34a);
  transition:1.2s ease;
}

/* BADGE */
.badge{
  align-self:flex-start;
  font-size:11px;
  padding:4px 8px;
  border-radius:6px;
  color:white;
}

.Excellent{background:#16a34a;}
.VeryGood{background:#2563eb;}
.Good{background:#f59e0b;}
.Average{background:#64748b;}
.Outstanding{background:#a855f7;}

/* FOOTER */
.footer{
  text-align:center;
  padding:12px;
  font-size:12px;
  color:rgba(248,250,252,0.7);
  border-top:1px solid var(--border);
  background:rgba(255,255,255,0.03);
}

/* 📱 MOBILE FIX */
@media (max-width:600px){

  .stats{
    grid-template-columns:1fr;
  }

  .topline{
    flex-direction:column;
    align-items:flex-start;
  }

  .name{font-size:14px;}
  .score{font-size:13px;}
  .roll,.address{font-size:10px;}
}
</style>
</head>

<body>

<header>
  <h2>HARI JUNIOR COLLEGE</h2>
  <small>RESULTS PORTAL</small>
</header>

<div class="wrapper">

<div class="stats">
  <div class="statBox">Total Students<br><b id="total"></b></div>
  <div class="statBox">Top Score<br><b id="top"></b></div>
</div>

<div class="searchBox">
  <input type="text" id="search" placeholder="Search by Name or Roll Number...">
</div>

<div class="list" id="list"></div>

</div>

<footer class="footer">
  © 2026 HARI E-TECHNO SCHOOL | All Rights Reserved
</footer>

<script>
let students = [];

/* LIVE JSON */
fetch("https://raw.githubusercontent.com/pothabattulavinod/hari/refs/heads/main/HJCRES.json")
  .then(res => res.json())
  .then(data => {
    students = data.Students;

    document.getElementById("total").innerText = students.length;
    document.getElementById("top").innerText =
      Math.max(...students.map(s => s["Grand Exam Total"]));

    render(students);
  });

function render(list){

  let box = document.getElementById("list");

  if(!list || list.length === 0){
    box.innerHTML = `<div class="row" style="text-align:center;opacity:0.7">No results found</div>`;
    return;
  }

  list = [...list].sort((a,b)=>b["Grand Exam Total"]-a["Grand Exam Total"]);

  box.innerHTML = "";

  list.forEach(s=>{
    let percent = (s["Grand Exam Total"]/120)*100;
    let badge = s["Remarks"].replace(/\s/g,'');

    box.innerHTML += `
    <div class="row">

      <div class="topline">
        <div class="name">${s["Name"]}</div>
        <div class="score">${s["Grand Exam Total"]}/120</div>
      </div>

      <div class="meta">
        <div class="roll">${s["Roll No"]}</div>
        <div class="address">${s["Address"]}</div>
      </div>

      <div class="bar">
        <div class="fill" data-p="${percent}"></div>
      </div>

      <div class="badge ${badge}">
        ${s["Remarks"]}
      </div>

    </div>`;
  });

  setTimeout(()=>{
    document.querySelectorAll(".fill").forEach(e=>{
      e.style.width = e.dataset.p + "%";
    });
  },50);
}

/* FIXED SEARCH */
document.getElementById("search").addEventListener("input", function(){

  let val = this.value.trim().toLowerCase();

  if(val === ""){
    render(students);
    return;
  }

  let filtered = students.filter(s =>
    s["Name"].toLowerCase().includes(val) ||
    s["Roll No"].toLowerCase().includes(val)
  );

  render(filtered);
});
</script>

</body>
</html>
