<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Results Portal</title>

<style>
:root{
  --primary:#60a5fa;
  --card:rgba(255,255,255,0.06);
  --border:rgba(255,255,255,0.10);
  --text:#f8fafc;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:system-ui,Segoe UI,sans-serif;
  background:radial-gradient(circle at top,#1e3a8a,#0b1220 55%);
  color:var(--text);
  min-height:100vh;
  display:flex;
  flex-direction:column;
}

/* HEADER */
header{
  text-align:center;
  padding:18px 12px;
  background:rgba(255,255,255,0.04);
  border-bottom:1px solid var(--border);
  backdrop-filter:blur(12px);
}

header h2{
  margin:0;
  font-size:clamp(16px,2.5vw,22px);
  font-weight:900;
  letter-spacing:1px;
}

header small{
  display:block;
  margin-top:6px;
  font-size:12px;
  opacity:0.75;
  letter-spacing:2px;
}

/* TITLE */
.grand-title{
  text-align:center;
  padding:12px 10px;
  font-size:clamp(18px,3vw,26px);
  font-weight:900;
  letter-spacing:2px;
  color:var(--primary);
}

/* WRAPPER */
.wrapper{
  flex:1;
  width:100%;
  max-width:900px;
  margin:auto;
  padding:16px;
  display:flex;
  flex-direction:column;
  gap:14px;
}

/* STATS */
.stats{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
  gap:12px;
}

.statBox{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:14px;
  padding:12px;
  text-align:center;
  backdrop-filter:blur(10px);
  font-size:14px;
}

/* ✅ PROFESSIONAL SEARCH INPUT */
.searchBox input{
  width:100%;
  padding:14px 16px;
  border-radius:14px;
  border:1px solid rgba(255,255,255,0.12);
  background:rgba(255,255,255,0.06);
  color:#f8fafc;
  outline:none;
  font-size:15px;
  font-weight:500;
  letter-spacing:0.5px;
  transition:0.25s ease;
  backdrop-filter:blur(10px);
}

/* placeholder */
.searchBox input::placeholder{
  color:rgba(248,250,252,0.5);
  font-weight:400;
}

/* focus glow */
.searchBox input:focus{
  border-color:#60a5fa;
  box-shadow:0 0 0 3px rgba(96,165,250,0.25);
  background:rgba(255,255,255,0.08);
}

/* LIST */
.list{
  display:flex;
  flex-direction:column;
  gap:12px;
}

/* CARD */
.row{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:14px;
  padding:14px;
  backdrop-filter:blur(14px);
  display:flex;
  flex-direction:column;
  gap:10px;
  transition:0.2s;
}

.row:hover{
  transform:translateY(-2px);
  box-shadow:0 10px 20px rgba(0,0,0,0.3);
}

/* TOP */
.topline{
  display:flex;
  justify-content:space-between;
  flex-wrap:wrap;
  gap:8px;
}

.name{
  font-size:16px;
  font-weight:900;
  color:var(--primary);
  word-break:break-word;
}

.score{
  font-weight:800;
  font-size:13px;
}

/* META */
.meta{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
}

.roll,
.address{
  font-size:11px;
  padding:5px 8px;
  border-radius:7px;
  word-break:break-word;
}

.roll{
  background:rgba(59,130,246,0.18);
  border:1px solid rgba(59,130,246,0.35);
  font-family:monospace;
}

.address{
  background:rgba(34,197,94,0.12);
  border-left:3px solid #22c55e;
}

/* PROGRESS */
.bar{
  width:100%;
  height:6px;
  background:rgba(255,255,255,0.12);
  border-radius:10px;
  overflow:hidden;
}

.fill{
  height:100%;
  width:0%;
  background:linear-gradient(90deg,#22c55e,#16a34a);
  transition:1s ease;
}

/* BADGE */
.badge{
  align-self:flex-start;
  font-size:11px;
  padding:5px 8px;
  border-radius:7px;
  color:white;
}

.Excellent{background:#16a34a;}
.VeryGood{background:#2563eb;}
.Good{background:#f59e0b;}
.Average{background:#64748b;}
.Outstanding{background:#a855f7;}

/* FOOTER */
.footer{
  text-align:center;
  padding:14px;
  font-size:11px;
  color:rgba(248,250,252,0.65);
  border-top:1px solid var(--border);
  background:rgba(255,255,255,0.03);
  margin-top:auto;
}

/* MOBILE */
@media (max-width:480px){
  .row{
    padding:12px;
  }

  .score{
    font-size:12px;
  }

  .roll,.address{
    font-size:10px;
  }
}
</style>
</head>

<body>

<header>
  <h2>HARI JUNIOR COLLEGE</h2>
  <small>RESULTS PORTAL</small>
</header>

<div class="grand-title">
  GRAND EXAM RESULT
</div>

<div class="wrapper">

<div class="stats">
  <div class="statBox">Total Students<br><b id="total"></b></div>
  <div class="statBox">Top Score<br><b id="top"></b></div>
</div>

<div class="searchBox">
  <input type="text" id="search" placeholder="Search by Name or Roll Number...">
</div>

<div class="list" id="list"></div>

</div>

<footer class="footer">
  © 2026 HARI E-TECHNO SCHOOL | All Rights Reserved
</footer>

<script>
let students = [];

fetch("https://raw.githubusercontent.com/pothabattulavinod/hari/refs/heads/main/HJCRES.json")
  .then(res => res.json())
  .then(data => {
    students = data.Students;

    document.getElementById("total").innerText = students.length;
    document.getElementById("top").innerText =
      Math.max(...students.map(s => s["Grand Exam Total"]));

    render(students);
  });

function render(list){

  let box = document.getElementById("list");

  if(!list.length){
    box.innerHTML = `<div class="row" style="text-align:center;opacity:0.7">No results found</div>`;
    return;
  }

  list = [...list].sort((a,b)=>b["Grand Exam Total"]-a["Grand Exam Total"]);

  box.innerHTML = "";

  list.forEach(s=>{
    let percent = (s["Grand Exam Total"]/120)*100;
    let badge = s["Remarks"].replace(/\s/g,'');

    box.innerHTML += `
    <div class="row">

      <div class="topline">
        <div class="name">${s["Name"]}</div>
        <div class="score">${s["Grand Exam Total"]}/120</div>
      </div>

      <div class="meta">
        <div class="roll">${s["Roll No"]}</div>
        <div class="address">${s["Address"]}</div>
      </div>

      <div class="bar">
        <div class="fill" data-p="${percent}"></div>
      </div>

      <div class="badge ${badge}">
        ${s["Remarks"]}
      </div>

    </div>`;
  });

  setTimeout(()=>{
    document.querySelectorAll(".fill").forEach(e=>{
      e.style.width = e.dataset.p + "%";
    });
  },50);
}

document.getElementById("search").addEventListener("input",function(){

  let val = this.value.trim().toLowerCase();

  if(!val){
    render(students);
    return;
  }

  let filtered = students.filter(s =>
    s["Name"].toLowerCase().includes(val) ||
    s["Roll No"].toLowerCase().includes(val)
  );

  render(filtered);
});
</script>

</body>
</html>
